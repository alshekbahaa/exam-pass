:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#12233f; --muted:#6b7a90;
  --accent:#c1272d; --gold:#b8892b; --line:#d9e0ea; --soft:#f4f7fb;
  --ok:#0f7b53; --warn:#b8860b;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo','Amiri',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit}
/* ---------- الشريط العلوي ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 18px;background:linear-gradient(180deg,#12233f,#1b3a6b);color:#fff;
  box-shadow:0 2px 10px rgba(16,30,50,.18);position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(193,39,45,.28)}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.72;letter-spacing:0}
.topbar .spacer{flex:1}
.btn{
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;
  padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  transition:.15s; display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent}
.btn.primary:hover{background:#a71f25}
.btn.gold{background:var(--gold);border-color:transparent;color:#241a05}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
/* ---------- التخطيط ---------- */
main{display:grid;grid-template-columns:392px 1fr;gap:16px;padding:16px;align-items:start}
@media (max-width:1080px){main{grid-template-columns:1fr}}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(18,35,63,.06);overflow:hidden;
}
aside.panel{position:sticky;top:74px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
#controls{overflow:auto;flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--soft);border-bottom:1px solid var(--line)}
.tab{
  border:0;background:transparent;padding:7px 11px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--muted)
}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(18,35,63,.12)}
.section{padding:12px 14px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;
  background:#fff;color:var(--ink);width:100%
}
.fld input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px;cursor:pointer}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld .row{display:flex;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:11px;color:var(--muted);line-height:1.6}
/* ---------- المسرح ---------- */
.stage{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(18,35,63,.06);padding:14px;position:sticky;top:74px
}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stagebar .grow{flex:1}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.cardwrap{
  direction:ltr;
  background:
    repeating-conic-gradient(#e6ebf2 0% 25%, #f6f8fb 0% 50%) 50%/16px 16px;
  border-radius:12px;padding:26px;display:flex;justify-content:center;align-items:center;
  overflow:auto;min-height:340px;align-items:self-start
}
/* أقسام قابلة للطي */
.acc{border-bottom:1px solid var(--line)}
.acc>summary{
  cursor:pointer;list-style:none;padding:10px 14px;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;color:var(--ink);background:#fff;user-select:none
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:before{content:'▾';font-size:11px;color:var(--muted);transition:.15s}
.acc[open]>summary:before{transform:rotate(0)}
.acc:not([open])>summary:before{transform:rotate(-90deg)}
.acc>summary i{width:7px;height:7px;border-radius:2px;background:var(--gold);display:inline-block}
.acc .body{padding:2px 14px 12px}
#stageBox{position:relative;flex:0 0 auto}
#cardHolder{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 10px 22px rgba(18,35,63,.22))}
/* ---------- الطلاب ---------- */
.students{width:100%;border-collapse:collapse;font-size:12px}
.students th,.students td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:right}
.students th{background:var(--soft);font-weight:700;color:var(--muted);font-size:11px}
.students tr.sel td{background:#fdf2f2}
.students td input{border:1px solid transparent;border-radius:6px;padding:4px 6px;width:100%;font-size:12px;background:transparent}
.students td input:focus{border-color:var(--line);background:#fff;outline:none}
.rowbtns{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer;font-size:11px}
.mini.danger{color:#b3202a;border-color:#f0c9cc}
/* ---------- إشعار ---------- */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;
  background:#12233f;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  transition:.25s;pointer-events:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)
}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- منطقة الطباعة ---------- */
#printArea{display:none}
/* ---------- استجابة ---------- */
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff}
  #printArea{display:block}
  .pc{page-break-after:always;break-after:page}
  .pc:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>

      </div>
      <div class="fld" style="flex-direction:row;align-items:center;gap:8px">

  </section>
</main>

})();

/* ==================================================================
   1) محرّك بناء البطاقة (مطابق لـ cardlib.py)
   ================================================================== */
const PXMM = 96/25.4;                 // px per mm
const MM   = v => v*PXMM;             // mm → px   (للقياس فقط)
const mm   = v => v*72/25.4;          // mm → pt   (كل الهندسة بالـ pt)
const PT   = v => v*96/72;            // pt → px
const P    = pt => (Math.round(pt*96/72*1000)/1000) + 'px';   // pt → px string
const Mx   = v  => P(mm(v));                            // mm → px string
const lh   = pt => Math.ceil(PT(pt)*0.98)+'px';         // line-height من pt

const MEASURE = (function(){
  const c = document.createElement('canvas').getContext('2d');
  return function(text, sizePt, family, bold, spacingPt=0){
    const fam = family==='latin' ? "'Tinos',serif" : family==='cairo' ? "'Cairo',sans-serif" : "'Amiri',serif";
    c.font = `${bold?'700':'400'} ${PT(sizePt).toFixed(2)}px ${fam}`;
    const w = c.measureText(text||'').width;
    return w + PT(spacingPt)*Math.max(0,(text||'').length-1);
  };
})();
/* maxW بالبكسل */
function isCodeTxt(t){ return /^[0-9\s\/\\.:\-]+$/.test(String(t||'').trim()); }
function pickFamily(text, family){
  if (family === 'arabic') return isCodeTxt(text) ? 'cairo' : 'arabic';
  return 'latin';
}
function fitSize(text, sizePt, maxWpx, family, bold, spacingPt=0, minSize=3.2){
  family = pickFamily(text, family);
  const limit = maxWpx * 0.97;
  let s = sizePt, guard = 0;
  while (s > minSize && MEASURE(text, s, family, bold, spacingPt) > limit && guard < 900){ s -= 0.04; guard++; }
  return Math.round(s*100)/100;
}
/* نمط السطر: الحجم (مضاعف) واللون والمحاذاة من إعدادات الجدول */
function lineStyle(tb, key, th){
  const st = (tb && tb.style) || {};
  const g = +((st.global||{}).scale ?? 1) || 1;
  const d = st[key] || {};
  const base = {en_label:th.ink, ar_label:th.ink, en_value:th.ink, ar_value:th.ink, accent:th.ink}[key] || th.ink;
  return {scale:(d.scale ?? 1)*g,
          color:d.color || base,
          opacity:(d.opacity ?? (key.includes('value')||key==='accent' ? 1 : .78)),
          align:d.align || (key.startsWith('en')||key==='accent' ? 'ltr' : 'rtl')};
}

function cardHTML(cfg, student){
  const st = student || {};
  const th = cfg.theme;
  const W = mm(cfg.card.w_mm), H = mm(cfg.card.h_mm);     // pt
  const Wpx = MM(cfg.card.w_mm), Hpx = MM(cfg.card.h_mm); // px للقياس
  const o = [];
  const A = s => o.push(s);
  const val = (d, side) => {
    const k = d['key_'+side] || (side==='en' ? (d.key||'') : '');
    if (k && st[k] != null && st[k] !== '') return String(st[k]);
    return String(d['value_'+side] ?? '');
  };

  /* ---- الخلفية ---- */
  const bg = cfg.background;
  if (bg.mode === 'gradient'){
    const g = bg.gradient || ['#fff','#fff'];
    A(`<div style="position:absolute;left:0;top:0;width:${P(W)};height:${P(H)};background:linear-gradient(135deg,${g[0]},${g[1]});"></div>`);
  } else {
    A(`<div style="position:absolute;left:0;top:0;width:${P(W)};height:${P(H)};background:${bg.color||'#fff'};"></div>`);
    if ((bg.mode==='pattern'||bg.mode==='image') && bg.image){
      A(`<img src="${bg.image}" style="position:absolute;left:0;top:0;width:${P(W)};height:${P(H)};object-fit:cover;opacity:${bg.opacity};" draggable="false">`);
    }
  }
  if (+bg.tint_opacity > 0){
    A(`<div style="position:absolute;left:0;top:0;width:${P(W)};height:${P(H)};background:${bg.tint};opacity:${bg.tint_opacity};"></div>`);
  }

  /* ---- الشعار المائي ---- */
  const wm = cfg.watermark;
  if (wm.show && wm.image){
    A(`<img src="${wm.image}" style="position:absolute;left:${Mx(wm.x_mm)};top:${Mx(wm.y_mm)};width:${Mx(wm.w_mm)};opacity:${wm.opacity};" draggable="false">`);
  }

  /* ---- الحدود ---- */
  const fr = cfg.frame, rad = mm(fr.radius_mm);
  ['outer','inner'].forEach(k=>{
    const b = fr[k];
    if (!b || !b.show) return;
    const ins = mm(b.inset_mm);
    A(`<div style="position:absolute;left:${P(ins)};top:${P(ins)};width:${P(W-2*ins)};height:${P(H-2*ins)};border:${P(b.w)} solid ${b.color};border-radius:${P(Math.max(.6, rad-ins*.6))};"></div>`);
  });
  const dz = fr.dashes;
  if (dz && dz.show){
    const n = +dz.count, dw = +dz.w, gp = +dz.gap, dh = +dz.h;
    const total = n*dw + (n-1)*gp, x0 = (W-total)/2, ins = mm(dz.inset_mm);
    for (let i=0;i<n;i++){
      [ins, H-ins-dh].forEach(yy=>{
        A(`<div style="position:absolute;left:${P(x0+i*(dw+gp))};top:${P(yy)};width:${P(dw)};height:${P(dh)};background:${dz.color};opacity:${dz.opacity};"></div>`);
      });
    }
  }

  /* ---- العنوان ---- */
  const hd = cfg.header;
  if (hd.show !== false){
    const ins0 = (hd.text_inset_mm!==undefined? hd.text_inset_mm : 14.0);
    const boxL = mm(ins0), boxW = W - 2*mm(ins0), boxWpx = PT(boxW);
    const cssAlign = {center:'center', start:'right', end:'left'}[hd.align||'center'];
    const arS = fitSize(hd.ar, hd.ar_size, boxWpx, 'arabic', true);
    A(`<div style="position:absolute;left:${P(boxL)};top:${Mx(hd.y_ar_mm)};width:${P(boxW)};text-align:${cssAlign};font-size:${P(arS)};font-weight:700;color:${hd.color};line-height:${lh(arS*1.25)};white-space:nowrap;">${esc(hd.ar)}</div>`);
    const enS = fitSize(hd.en, hd.en_size, boxWpx, 'latin', true, (hd.letter_spacing||0)*0.75);
    A(`<div dir="ltr" style="position:absolute;left:${P(boxL)};top:${Mx(hd.y_en_mm)};width:${P(boxW)};text-align:${cssAlign};font-family:Montserrat;font-size:${P(enS)};font-weight:700;letter-spacing:${P(hd.letter_spacing)};color:${hd.color};line-height:${lh(enS*1.25)};white-space:nowrap;">${esc(hd.en)}</div>`);
    const r = hd.rule;
    if (r && r.show){
      const ins = mm(r.inset_mm);
      A(`<div style="position:absolute;left:${P(ins)};top:${Mx(r.y_mm)};width:${P(W-2*ins)};height:${P(r.w)};background:${r.color};"></div>`);
    }
    ['logo','flag'].forEach(k=>{
      const ob = hd[k];
      if (ob && ob.show && ob.image){
        /* height:auto يحافظ على نسبة الصورة الأصلية (لا قصّ ولا تمدّد) */
        A(`<img src="${ob.image}" style="position:absolute;left:${Mx(ob.x_mm)};top:${Mx(ob.y_mm)};width:${Mx(ob.w_mm)};height:auto;object-fit:contain;" draggable="false">`);
      }
    });
  }

  /* ---- الصورة ---- */
  const ph = cfg.photo;
  if (ph.show){
    const px = mm(ph.x_mm), py = mm(ph.y_mm), pw = mm(ph.w_mm), phh = mm(ph.h_mm);
    const src = st.photo || ph.image || '';
    const stl = `position:absolute;left:${P(px)};top:${P(py)};width:${P(pw)};height:${P(phh)};border:${P(ph.border_w)} solid ${ph.border_color};border-radius:${P(mm(ph.radius_mm))};`;
    if (src){
      A(`<img src="${src}" style="${stl}object-fit:${ph.fit||'cover'};" draggable="false">`);
    } else {
      A(`<div style="${stl}background:${th.soft};color:${th.ink};font-family:Montserrat;font-size:4.6pt;text-align:center;line-height:${lh(phh)};opacity:.7;">${esc(ph.placeholder||'PHOTO')}</div>`);
    }
  }

  /* ---- الختم العلوي ---- */
  const ts = cfg.top_stamp;
  if (ts.show && ts.image){
    const sw = mm(ts.w_mm);
    const roundCss = ts.round ? 'object-fit:cover;clip-path:circle(50% at 50% 50%);' : 'object-fit:contain;';
    A(`<img src="${ts.image}" style="position:absolute;left:${Mx(ts.x_mm)};top:${Mx(ts.y_mm)};width:${P(sw)};height:${P(sw)};opacity:${ts.opacity};transform:rotate(${ts.rotate||0}deg);${roundCss}" draggable="false">`);
    if (ts.label_ar){
      const lw = sw*1.9;
      A(`<div style="position:absolute;left:${P(mm(ts.x_mm)-(lw-sw)/2)};top:${P(mm(ts.y_mm)+sw+mm(.3))};width:${P(lw)};text-align:center;font-size:${P(ts.label_size)};color:${ts.label_color};white-space:nowrap;">${esc(ts.label_ar)}</div>`);
    }
  }

  /* ---- الشريط العلوي (اختياري) ---- */
  const sp = cfg.strip;
  if (sp && sp.show && (sp.cells||[]).length){
    const cells = sp.cells, n = cells.length, pad = 2.6, cellW = PT(mm(sp.w_mm)/n);
    const grid = `${P(sp.grid_w)} solid ${sp.grid_color}`;
    A(`<table dir="ltr" style="position:absolute;left:${Mx(sp.x_mm)};top:${Mx(sp.y_mm)};width:${Mx(sp.w_mm)};border-collapse:collapse;table-layout:fixed;border-spacing:0">`);
    A('<tr>');
    cells.forEach(c=>{
      let v = String(c.value ?? '');
      if (c.key && st[c.key] != null && st[c.key] !== '') v = String(st[c.key]);
      const ls = fitSize(c.label_en||'', sp.lab_size, cellW-pad, 'latin');
      const vs = fitSize(v, sp.val_size, cellW-pad, 'latin', true);
      A(`<td style="width:${(100/n).toFixed(3)}%;height:${Mx(sp.h_mm)};border:${grid};padding:0 ${P(pad/2)};vertical-align:middle;">`
       +`<div dir="ltr" style="font-family:Montserrat;font-size:${P(ls)};color:${th.ink};opacity:.78;line-height:${lh(ls*1.28)};white-space:nowrap;overflow:hidden;">${esc(c.label_en||'')}</div>`
       +`<div dir="ltr" style="font-family:Montserrat;font-size:${P(vs)};font-weight:700;color:${th.accent};line-height:${lh(vs*1.22)};white-space:nowrap;overflow:hidden;">${esc(v)}</div></td>`);
    });
    A('</tr></table>');
  }

  /* ---- جدول البيانات (نفس تقسيم البطاقة الأصلية) ---- */
  const tb = cfg.table, rows = tb.rows||[], ft = cfg.footer;
  const bottomY = mm(ft.y_mm) - mm(1.4);
  const topY = mm(tb.y_mm);
  const tw = mm(tb.w_mm), gw = +tb.grid_w;
  const zoomT = +(tb.table_zoom ?? 1) || 1;
  let lab = (+tb.lab_size)*zoomT, valn = (+tb.val_size)*zoomT;
  const MAXW = ptv => Math.max(6, PT(ptv)*0.92);
  const rowCells = r => r.cells || [r];
  const keyOf = (c, side) => {
    const k = c['key_'+side] || '';
    if (k && st[k] != null && st[k] !== '') return String(st[k]);
    return String(c['value_'+side] ?? '');
  };
  const Sraw = k => (+(((tb.style||{})[k]||{}).scale ?? 1)) * (+(((tb.style||{}).global||{}).scale ?? 1) || 1);
  const rowS = r => {
    const pr = [];
    rowCells(r).forEach(c=>{ const k=c.kind||'std';
      if (k==='std'||k==='std_ar') pr.push('en_label','en_value');
      else if (k==='value') pr.push('en_label','accent');
      else if (k==='ar_only') pr.push('en_label');
      else if (k==='ar_label_value') pr.push('ar_label');
      else pr.push('ar_label','ar_value'); });
    const top = Math.max(1, ...pr.filter(k=>['en_value','ar_value','accent'].includes(k)).map(Sraw));
    return k => Sraw(k)/top;
  };
  /* ---------- بنية المرجع: أعمدة وأحجام مقيسة من البطاقة الحقيقية ---------- */
  const RT = (tb.ref) || {
    rows_pt: [10.2, 16.0, 15.7, 11.5, 12.0, 12.8, 11.2],
    layout: [
      {w:[26.3,37.7,36.0], cells:['type_cell','country_cell','no_cell']},
      {w:[50,50], cells:['en_stack','ar_pair']},
      {w:[50,50], cells:['en_stack','ar_pair']},
      {w:[26.0,30.0,15.0,29.0], cells:['en_stack','blank','ar_gender','ar_date_end']},
      {w:[50,50], cells:['en_stack','ar_pair']},
      {w:[50,50], cells:['en_stack','ar_pair']},
      {w:[50,50], cells:['en_stack','ar_pair']}
    ],
    sizes: {lab:6.0, val:9.5, val_place:7.9, val_auth:7.0, val_date:7.3,
            ar_lab:4.4, ar_val:7.1, ar_val_small:5.2, ar_date:6.4,
            code_lab:5.4, code_val:7.1, code_val2:7.0, code_val3:7.8},
    lh_factor: 0.80
  };
  const RZ = +tb.table_zoom || 1;
  const CZ = +tb.code_zoom || 1;                    /* تصغير خانات الأكواد */
  const SZ = {};
  Object.entries(RT.sizes).forEach(([k,v])=>{
    SZ[k] = v * RZ * (/^code_/.test(k) ? CZ : 1);
  });
  const LH = +tb.lh_factor || RT.lh_factor || .80;

  /* سطر نصي واحد: خط + حجم + لون + اتجاه */
  const lstyle = (key) => lineStyle(tb, key, th);
  const faceOf = (fam) => fam==='latin' ? 'Tinos,serif' : 'Amiri,serif';

  function lineOf(text, size, key, fam='latin', opts={}){
    const sd = lstyle(key);
    let sz = size * sd.scale;
    const fam2 = fam==='latin' ? (isCodeTxt(text)||!text ? 'latin' : 'latin')
                                : (isCodeTxt(text) ? 'arabic' : 'arabic');
    if (opts.widthPt != null) sz = fitSize(text, sz, MAXW(opts.widthPt), fam2==='latin'?'latin':'arabic', opts.bold);
    const dir = opts.dir || (fam2==='latin' ? 'ltr' : 'rtl');
    const ta = opts.align || (dir==='ltr' ? 'left' : 'right');
    const edge = ta==='right' ? 'padding-right:1.2px;' : 'padding-left:1.2px;';
    return `<div dir="${dir}" style="font-family:${faceOf(fam2)};font-size:${P(sz)};`
      + `${opts.bold?'font-weight:700;':''}${opts.caps?'font-variant:small-caps;':''}`
      + `color:${sd.color};opacity:${sd.opacity};line-height:${lh(sz*LH)};`
      + `${opts.spacing?`letter-spacing:${P(opts.spacing)};`:''}${edge}white-space:nowrap;`
      + `overflow:visible;text-align:${ta};">${esc(text)}</div>`;
  }

  /* خانة عربية: العنوان يمينًا والقيمة إلى يساره */
  function arPairOf(label, value, labPct, vsize){
    const sl = lstyle('ar_label'), sv = lstyle('ar_value');
    const labW = cwPtOf(label) * labPct/100;
    return `<table dir="rtl" style="width:100%;border-collapse:collapse;table-layout:fixed;"><tr>`
      + `<td style="border:0;padding:0 ${P(1.2)};vertical-align:middle;width:${labPct}%;">`
      + lineOf(label, SZ.ar_lab, 'ar_label', 'arabic', {widthPt: labW-3})
      + `</td><td style="border:0;padding:0 ${P(1.2)};vertical-align:middle;">`
      + lineOf(value, vsize || SZ.ar_val, 'ar_value', 'arabic',
              {widthPt: cwPtOf(value) - labW - 3, dir: isCodeTxt(value)?'ltr':'rtl',
               align: isCodeTxt(value)?'left':'right'})
      + `</td></tr></table>`;
  }
  let CW = 0;                                   // عرض الخانة الحالي (pt)
  const cwPtOf = () => CW;

  const cellHTML = (cell, widthPct, cwPtv, colSpan) => {
    CW = cwPtv;
    const grid = `${P(gw)} solid ${tb.grid_color}`;
    const kind = cell.kind || 'std';
    const span = colSpan || cell.span || 1;
    const spanAttr = span > 1 ? ` colspan="${span}"` : '';
    const pad = 1.6;
    const stl = {en_label:lstyle('en_label'), en_value:lstyle('en_value'),
                 ar_label:lstyle('ar_label'), ar_value:lstyle('ar_value'), accent:lstyle('accent')};
    Object.entries(cell.style||{}).forEach(([k,v])=>{ if(stl[k]) stl[k]={...stl[k],...v}; });
    const td = `style="width:${widthPct.toFixed(4)}%;border:${grid};padding:0 ${P(pad)};vertical-align:middle;overflow:hidden;"`;
    const ve = keyOf(cell,'en'), va = keyOf(cell,'ar');
    const le = cell.label_en || '', la = cell.label_ar || '';
    const small = (t,k,w,al='left') => lineOf(t, SZ[k], 'en_label', 'latin', {caps:true, spacing:.35, widthPt:w, align:al});
    const val = (t,k,w,al='left',ks='en_value') => lineOf(t, SZ[k], ks, 'latin', {widthPt:w, align:al});

    let body = '';
    if (kind === 'type_cell')
      body = small(le,'code_lab',cwPtv-2*pad) + val(ve,'code_val',cwPtv-2*pad);
    else if (kind === 'country_cell')
      body = `<table dir="ltr" style="width:100%;border-collapse:collapse;table-layout:fixed;">`
        + `<colgroup><col style="width:71%"><col style="width:29%"></colgroup><tr>`
        + `<td style="border:0;padding:0;">${small(le,'code_lab',cwPtv*.70)}</td>`
        + `<td style="border:0;padding:0;">${val(ve,'code_val2',cwPtv*.30,'right')}</td></tr></table>`;
    else if (kind === 'no_cell')
      body = `<table dir="rtl" style="width:100%;border-collapse:collapse;table-layout:fixed;"><tr>`
        + `<td style="border:0;padding:0;width:26%;">${lineOf(la, SZ.ar_lab, 'ar_label','arabic',{widthPt:cwPtv*.26})}</td>`
        + `<td style="border:0;padding:0;">${val(ve,'code_val3',cwPtv*.55,'right')}</td>`
        + `<td style="border:0;padding:0;width:14%;">${small(le,'code_lab',cwPtv*.17,'right')}</td></tr></table>`;
    else if (kind === 'blank') body = '';
    else if (kind === 'ar_gender')   /* «الجنس ذكر» على سطر واحد مثل المرجع */
      body = lineOf(la + ' ' + va, SZ.ar_val_small, 'ar_label', 'arabic', {widthPt:cwPtv-2*pad, align:'right'});
    else if (kind === 'ar_date_end')
      body = `<table dir="rtl" style="width:100%;border-collapse:collapse;table-layout:fixed;">`
        + `<colgroup><col style="width:38%"><col style="width:62%"></colgroup><tr>`
        + `<td style="border:0;padding:0;">${lineOf(la,SZ.ar_val_small*.92,'ar_label','arabic',{widthPt:cwPtv*.38})}</td>`
        + `<td style="border:0;padding:0;">${lineOf(st.birth||'',SZ.ar_val_small,'ar_value','latin',{widthPt:cwPtv*.62,dir:'ltr',align:'left'})}</td></tr></table>`;
    else if (kind === 'en_stack'){
      const k = cell.value_color === 'accent' ? 'accent' : 'en_value';
      let vs = SZ.val;
      if (le.startsWith('PLACE OF BIRTH')) vs = SZ.val_place;
      else if (le.startsWith('SUING')) vs = SZ.val_auth;
      else if (le.startsWith('DATA OF')) vs = SZ.val_date;
      body = small(le,'lab',cwPtv-2*pad) + lineOf(ve, vs, k, 'latin', {widthPt:cwPtv-2*pad});
    }
    else if (kind === 'ar_pair'){
      const small2 = ['سوري','ذكر'].includes(String(va).trim());
      body = arPairOf(la, va, 30.0, small2 ? SZ.ar_val_small : SZ.ar_val);
    }
    else if (kind === 'value')
      body = lineOf(ve, SZ.val, 'accent','latin',{widthPt:cwPtv-2*pad});
    else if (kind === 'ar_only')
      body = lineOf(la, SZ.ar_lab, 'ar_label','arabic',{widthPt:cwPtv-2*pad});
    else if (kind === 'ar_inline')
      body = arPairOf(la, va, 30.0, SZ.ar_val);
    else if (kind === 'std_ar')
      body = small(le,'code_lab',cwPtv*.55) + val(ve,'code_val',cwPtv*.55);
    else
      body = small(le,'lab',cwPtv-2*pad) + val(ve,'val',cwPtv-2*pad);
    return `<td${spanAttr} ${td}>${body}</td>`;
  };

  /* ---------- بناء الجدول بارتفاعات المرجع ---------- */
  const GRIDN = 1000;
  const heights = RT.rows_pt.map(v => v*RZ);
  const buildTable = () => {
    let h = `<table data-tbl="1" dir="ltr" style="position:absolute;left:${Mx(tb.x_mm)};top:${P(topY)};`
          + `width:${P(tw)};border-collapse:collapse;table-layout:fixed;border-spacing:0;">`
          + '<colgroup>' + '<col style="width:0.1%">'.repeat(GRIDN) + '</colgroup>';
    rows.forEach((r, i)=>{
      const lay = RT.layout[i] || {w:[50,50], cells:[]};
      const kinds = lay.cells, weights = lay.w;
      const raw = rowCells(r);
      const cells = weights.map((w,j)=>({...(raw[j] || raw[raw.length-1] || {}), kind: kinds[j] || 'std'}));
      const spans = weights.map(w=>Math.max(1, Math.round(w/weights.reduce((a,b)=>a+b,0)*GRIDN)));
      spans[spans.indexOf(Math.max(...spans))] += GRIDN - spans.reduce((a,b)=>a+b,0);
      h += `<tr data-w="${(heights[i]||11).toFixed(2)}" style="height:${P(heights[i]||11)};">`;
      cells.forEach((c,j)=>{ h += cellHTML(c, spans[j]/GRIDN*100, tw*spans[j]/GRIDN, spans[j]); });
      h += '</tr>';
    });
    return h + '</table>';
  };
  A(buildTable());

  /* ضبط الجدول كالمرجع: ارتفاع كل صف بالـ pt وتباعد أسطر مضغوط */
  const fitRowsSoon = () => {
    const tbl = document.querySelector('#card table[data-tbl]');
    if (!tbl || !tbl.tBodies.length) return;
    const rowsArr = [...tbl.tBodies[0].rows];
    if (!rowsArr.length) return;
    rowsArr.forEach(tr => {
      const targetPx = PT(parseFloat(tr.dataset.w) || 10);       // pt → px
      let nMax = 1;
      [...tr.cells].forEach(td => {
        /* عدد الأسطر المتراكمة داخل الخانة = عدد <div> المباشرة فيها */
        const n = [...td.children].filter(k => k.tagName === 'DIV').length || 1;
        nMax = Math.max(nMax, n);
      });
      const td0 = tr.cells[0];
      /* bd يُحسب بعد تثبيت ارتفاع الصف (وإلا يكون صفرًا) */
      const bd = 1.6 + (+(tb.grid_w || .55)) * 2;   // حدود الصف العلوية/السفلية
      /* ارتفاع سطر أغلى خانة حتى لا يتقاطع النص */
      let needMax = 0;
      [...tr.querySelectorAll('div')].filter(d=>!d.querySelector('div')).forEach(d=>{
        needMax = Math.max(needMax, parseFloat(d.style.fontSize) || 8);
      });
      /* سطر واحد ⇒ ارتفاع كامل؛ سطران ⇒ نصف الارتفاع (متراص كالمرجع) */
      const perPx = Math.max(2.0, (targetPx - Math.max(1.0, bd)) / Math.max(1, nMax));
      [...tr.querySelectorAll('div')].forEach(d => {
        if (d.querySelector('div')) return;
        d.style.lineHeight = perPx + 'px';
      });
      tr.style.height = targetPx + 'px';
    });

    /* إن تجاوز الجدول المساحة حتى مقدّمة التذييل: تصغير نسبي موحّد (بلا قصّ)
       ملاحظة: نستخدم offsetHeight (بلا تحويلات CSS) لا getBoundingClientRect */
    const availPx = (MM(ft.y_mm) - MM(1.2)) - MM(tb.y_mm);
    const totalPx = rowsArr.reduce((a, r) => a + r.offsetHeight, 0);
    if (totalPx > availPx + 0.5){
      const k = availPx / totalPx;
      rowsArr.forEach(r => {
        r.style.height = (r.offsetHeight * k) + 'px';
        [...r.querySelectorAll('div')].forEach(d => {
          if (d.querySelector('div')) return;
          const fs = parseFloat(d.style.fontSize) || 8;
          const lhv = parseFloat(d.style.lineHeight) || fs;
          d.style.fontSize = (fs * k) + 'px';
          d.style.lineHeight = (lhv * k) + 'px';
        });
      });
    }
  };
  setTimeout(fitRowsSoon, 0);

  /* ---- التوقيع ---- */
  const sg = cfg.signature;
  if (sg.show){
    const sx = mm(sg.x_mm), sy = mm(sg.y_mm), sw = mm(sg.w_mm);
    const capAr = st.principal_ar || sg.caption_ar || '', capEn = sg.caption_en || '';
    A(`<div style="position:absolute;left:${P(sx)};top:${P(sy)};width:${P(sw)};height:${P(sg.line_w)};background:${sg.line_color};"></div>`);
    A(`<div style="position:absolute;left:${P(sx)};top:${P(sy+1.1)};width:${P(sw)};text-align:center;font-size:${P(sg.size)};color:${th.ink};line-height:${lh(sg.size*1.3)};white-space:nowrap;">${esc(capAr)}</div>`);
    if (capEn){
      A(`<div dir="ltr" style="position:absolute;left:${P(sx)};top:${P(sy+1.1+mm(1.9))};width:${P(sw)};text-align:center;font-family:Montserrat;font-size:${P(sg.size*.72)};color:${th.ink};opacity:.7;letter-spacing:.2pt;line-height:${lh(sg.size)};white-space:nowrap;">${esc(capEn)}</div>`);
    }
  }

  /* ---- التذييل: يمين سطر واحد + يسار 3 أسطر ---- */
  if (ft.show){
    const mode = ft.style || 'plain';
    let fy = mm(ft.y_mm);
    const mainAr = st.footer_ar || ft.main_ar || '';
    const maxW = PT(W - mm(7.0));

    const L1 = st.footer_en || ft.en1 || ft.main_en || '';
    const L2 = ft.en2 || (ft.sub_show ? (ft.sub_en||'') : '');
    const L3 = ft.en3 || '';
    const s1 = L1 ? fitSize(L1, (ft.en1_size ?? ft.en_size), maxW*.94, 'latin', true, .3) : 0;
    const s2 = L2 ? fitSize(L2, (ft.en2_size ?? ft.sub_size), maxW*.94, 'latin', false, .2) : 0;
    const s3 = L3 ? fitSize(L3, (ft.en3_size ?? ft.sub_size), maxW*.94, 'latin', false, .2) : 0;
    let gap = mm(ft.line_gap_mm ?? .35);
    const sAr = fitSize(mainAr, ft.ar_size, maxW*.46, 'arabic', true);
    /* لا تتجاوز الأسطر حدّ البطاقة السفلي */
    const availH = H - mm(1.6) - fy;
    let totH = s1*1.06 + s2*1.12 + s3*1.12 + gap*2;
    let k1 = 1, k2 = 1, k3 = 1;
    if (totH > availH && availH > 0){
      const kf = availH / totH;
      k1 = k2 = k3 = kf; gap = gap*kf;
    }
    const S1 = s1*k1, S2 = s2*k2, S3 = s3*k3;

    let tcol, bh = 0;
    if (mode === 'band' || mode === 'ribbon'){
      bh = mm(ft.band_h_mm);
      const totalH = S1*1.06 + S2*1.12 + S3*1.12 + gap*2;
      fy = fy - Math.max(0, (totalH - bh)/2);
      A(`<div style="position:absolute;left:${Mx(2.9)};top:${P(fy)};width:${P(W-mm(5.8))};height:${P(Math.max(bh, totalH+mm(1.2)))};background:${ft.band_color};border-radius:${P(mm(mode==='ribbon'?1.2:.7))};"></div>`);
      tcol = ft.band_text_color;
    } else { tcol = ft.color; }

    /* يمين: سطر واحد */
    A(`<div style="position:absolute;left:0;top:${P(fy+mm(ft.ar_dy_mm ?? .2))};width:${P(W-mm(3.4))};text-align:right;font-size:${P(sAr)};font-weight:700;color:${tcol};line-height:${lh(sAr*1.12)};white-space:nowrap;">${esc(mainAr)}</div>`);

    /* يسار: 3 أسطر */
    let y = fy;
    if (L1){
      A(`<div dir="ltr" style="position:absolute;left:${Mx(3.4)};top:${P(y)};font-family:Montserrat;font-size:${P(S1)};font-weight:700;letter-spacing:.3pt;color:${tcol};line-height:${lh(S1*1.06)};white-space:nowrap;">${esc(L1)}</div>`);
      y += S1*1.06 + gap;
    }
    if (L2){
      A(`<div dir="ltr" style="position:absolute;left:${Mx(3.4)};top:${P(y)};font-family:Montserrat;font-size:${P(S2)};letter-spacing:.2pt;color:${ft.sub_color};line-height:${lh(S2*1.12)};white-space:nowrap;">${esc(L2)}</div>`);
      y += S2*1.12 + gap;
    }
    if (L3){
      A(`<div dir="ltr" style="position:absolute;left:${Mx(3.4)};top:${P(y)};font-family:Montserrat;font-size:${P(S3)};letter-spacing:.2pt;color:${ft.sub_color};line-height:${lh(S3*1.12)};white-space:nowrap;">${esc(L3)}</div>`);
    }
  }

  return `<div id="card" style="position:relative;width:${P(W)};height:${P(H)};overflow:hidden;font-family:Amiri,serif;">${o.join('')}</div>`;
}

function currentStudent(){ return STUDENTS[CUR] || {}; }

function applyZoom(){
  const holder = document.getElementById('cardHolder');
  const box = document.getElementById('stageBox');
  if (!holder || !box) return;
  const w = MM(+CFG.card.w_mm), h = MM(+CFG.card.h_mm);
  holder.style.transform = `scale(${ZOOM/100})`;
  holder.style.transformOrigin = '0 0';
  box.style.width = (w*ZOOM/100) + 'px';
  box.style.height = (h*ZOOM/100) + 'px';
}

function paint(){
  const holder = document.getElementById('cardHolder');
  holder.innerHTML = cardHTML(CFG, currentStudent());
  applyZoom();
  document.getElementById('sizePill').textContent =
    `${CFG.card.w_mm} × ${CFG.card.h_mm} مم  ·  ${Math.round(+CFG.card.w_mm*300/25.4)}×${Math.round(+CFG.card.h_mm*300/25.4)} بكسل @300dpi`;
  if (document.getElementById('showGuides').checked) addGuides(holder.firstElementChild);
}
function addGuides(card){
  if (!card) return;
  card.style.outline = '1px dashed rgba(193,39,45,.55)';
  card.style.outlineOffset = '0px';
}

/* ---------- بناء عناصر التحكم ---------- */
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  });
  kids.flat().forEach(k=>{ if(k==null) return; e.appendChild(typeof k==='string'?document.createTextNode(k):k); });
  return e;
}

let ACTIVE_TAB = 'design';
let CURRENT_ACC = null;
function renderInto(item, host){
  if (item.t === 'head'){
    const d = el('details',{class:'acc', open: true});
    d.appendChild(el('summary',{}, el('i'), item.label));
    const body = el('div',{class:'body'}); d.appendChild(body); host.appendChild(d);
    return;                       /* المحتوى يُضاف من renderControls إلى body */
  }
  if (item.t === 'note'){ host.appendChild(el('p',{class:'hint', style:'margin:0 0 9px'}, item.text)); return; }
  if (item.t === 'grid'){
    const g = el('div',{class:'grid2'}); g.style.marginBottom='9px';
    item.items.forEach(f=> g.appendChild(fieldEl(f)));
    host.appendChild(g); return;
  }
  if (item.t === 'buttons'){
    const s2 = el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px'});
    item.items.forEach(b=> s2.appendChild(el('button',{class:'btn ghost sm', onclick:b.act}, b.label)));
    host.appendChild(s2); return;
  }
  if (item.t === 'lines'){ host.appendChild(linesEditor()); return; }
  if (item.t === 'rows'){ host.appendChild(rowsEditor(item.path)); return; }
  if (item.t === 'cells'){ host.appendChild(cellsEditor(item.path)); return; }
  if (item.t === 'students'){ host.appendChild(studentsEditor()); return; }
  const w = el('div',{style:'margin-bottom:9px'}); w.appendChild(fieldEl(item)); host.appendChild(w);
}

function renderControls(){
  const box = document.getElementById('controls');
  box.innerHTML = '';
  (SPEC[ACTIVE_TAB]||[]).forEach(item=>{
    if (item.t === 'head'){
      const d = el('details',{class:'acc', open: item.open !== false});
      d.appendChild(el('summary',{}, el('i'), item.label));
      const body = el('div',{class:'body'});
      d.appendChild(body);
      box.appendChild(d);
      CURRENT_ACC = body;
      return;
    }
    if (item.t === 'adv'){
      const d = el('details',{class:'acc adv'});
      d.appendChild(el('summary',{}, el('i'), '⚙️ خيارات متقدّمة'));
      const body = el('div',{class:'body'});
      d.appendChild(body);
      const saved = CURRENT_ACC;
      CURRENT_ACC = body;
      (item.items||[]).forEach(sub => renderInto(sub, body));
      CURRENT_ACC = saved;
      (CURRENT_ACC||box).appendChild(d);
      return;
    }
    if (item.t === 'note'){ (CURRENT_ACC||box).appendChild(el('p',{class:'hint', style:'margin:0 0 9px'}, item.text)); return; }
    if (item.t === 'grid'){
      const g = el('div',{class:'grid2'}); g.style.marginBottom='9px';
      item.items.forEach(f=> g.appendChild(fieldEl(f)));
      (CURRENT_ACC||box).appendChild(g); return;
    }
    if (item.t === 'buttons'){
      const s = el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px'});
      item.items.forEach(b=> s.appendChild(el('button',{class:'btn ghost sm', onclick:b.act}, b.label)));
      (CURRENT_ACC||box).appendChild(s); return;
    }
    if (item.t === 'cells'){ (CURRENT_ACC||box).appendChild(cellsEditor(item.path)); return; }
    if (item.t === 'rows'){ (CURRENT_ACC||box).appendChild(rowsEditor(item.path)); return; }
    if (item.t === 'lines'){ (CURRENT_ACC||box).appendChild(linesEditor()); return; }
    if (item.t === 'students'){ (CURRENT_ACC||box).appendChild(studentsEditor()); return; }
    const w = el('div',{style:'margin-bottom:9px'}); w.appendChild(fieldEl(item));
    (CURRENT_ACC||box).appendChild(w);
  });
}

function fieldEl(f){
  const wrap = el('div',{class:'fld'});
  const label = el('label',{}, f.label);
  wrap.appendChild(label);
  const val = get(f.path);
  if (f.t === 'check'){
    const cb = el('input',{type:'checkbox'});
    cb.checked = !!val;
    cb.addEventListener('change',()=>{ set(f.path, cb.checked); paint(); });
    wrap.innerHTML = '';
    wrap.appendChild(el('label',{class:'chk'}, cb, f.label));
    return wrap;
  }
  if (f.t === 'range'){
    const r = el('input',{type:'range', min:f.min, max:f.max, step:f.step, value: val ?? f.min});
    const out = el('span',{style:'font-size:11px;color:var(--muted);min-width:38px;text-align:left;direction:ltr'}, String(val ?? ''));
    r.addEventListener('input',()=>{ const v = parseFloat(r.value); set(f.path, v); out.textContent = v; paint(); });
    wrap.appendChild(el('div',{class:'row'}, r, out));
    return wrap;
  }
  if (f.t === 'color'){
    const c = el('input',{type:'color', value: val || '#000000'});
    c.addEventListener('input',()=>{ set(f.path, c.value); paint(); });
    wrap.appendChild(c);
    return wrap;
  }
  if (f.t === 'select'){
    const s = el('select');
    (f.options||[]).forEach(op=>{ const o = el('option',{value:op}, op); if (String(val)===String(op)) o.selected = true; s.appendChild(o); });
    s.addEventListener('change',()=>{ set(f.path, s.value); paint(); renderControls(); });
    wrap.appendChild(s);
    return wrap;
  }
  if (f.t === 'image'){
    const cur = val ? el('img',{src:val, style:'height:34px;border:1px solid var(--line);border-radius:6px;object-fit:contain;background:#fff'}) : el('span',{class:'hint'}, 'لا صورة');
    const file = el('input',{type:'file', accept:'image/*', hidden:'', onchange:e=>{
      const fl = e.target.files[0]; if(!fl) return;
      const rd = new FileReader();
      rd.onload = ()=>{ set(f.path, rd.result); paint(); renderControls(); toast('تم تحديث الصورة'); };
      rd.readAsDataURL(fl);
    }});
    const btn = el('button',{class:'btn ghost sm', onclick:()=>file.click()}, 'رفع صورة');
    const clr = el('button',{class:'btn ghost sm', onclick:()=>{ set(f.path,''); paint(); renderControls(); }}, 'مسح');
    wrap.appendChild(el('div',{class:'row', style:'flex-wrap:wrap'}, cur, btn, clr, file));
    return wrap;
  }
  if (f.t === 'number'){
    const n = el('input',{type:'number', step:f.step||1, value: val ?? 0});
    n.addEventListener('input',()=>{ set(f.path, parseFloat(n.value)||0); paint(); });
    wrap.appendChild(n);
    return wrap;
  }
  const t = el('input',{type:'text', value: val ?? ''});
  t.addEventListener('input',()=>{ set(f.path, t.value); paint(); });
  wrap.appendChild(t);
  return wrap;
}

/* ---------- محرر خلايا الشريط ---------- */
function cellsEditor(path){
  const arr = get(path) || [];

  arr.forEach((c, i)=>{
    const row = el('div',{style:'border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px;background:var(--soft)'});
    row.appendChild(el('div',{class:'grid3'},
      miniField('العنوان EN', c.label_en, v=>{ c.label_en=v; paint(); }),
      miniField('العنوان AR', c.label_ar, v=>{ c.label_ar=v; paint(); }),
      miniField('القيمة', c.value, v=>{ c.value=v; paint(); })
    ));
    row.appendChild(el('div',{class:'row', style:'margin-top:7px'},
      miniField('مفتاح الطالب (اختياري)', c.key||'', v=>{ c.key=v; paint(); }),

function miniField(label, value, onChange){

  return el('div',{class:'fld', style:'flex:1'}, el('label',{}, label), i);

/* ---------- محرّر أنماط الخطوط (كل سطر على حدة) ---------- */
const LINE_DEFS = [
  ['en_label', 'عنوان إنجليزي (GIVEN NAMES)'],
  ['en_value', 'قيمة إنجليزية (MONTASER)'],
  ['ar_label', 'عنوان عربي (الاسم / تاريخ الولادة)'],
  ['ar_value', 'قيمة عربية (منتصر بالله / سوري)'],
  ['accent',   'قيمة ملوّنة (التاريخ الأحمر)']
];

function linesEditor(){
  const s = el('div');
  s.appendChild(el('div',{class:'row', style:'justify-content:flex-end;margin-bottom:8px'},
    el('button',{class:'mini', style:'padding:4px 10px', onclick:()=>{
      set('table.style', {en_label:{scale:1,color:'#43536a',opacity:.78,align:'ltr'},
                          en_value:{scale:1,color:'#12233f',opacity:1,align:'ltr'},
                          ar_label:{scale:1,color:'#43536a',opacity:.80,align:'rtl'},
                          ar_value:{scale:1,color:'#12233f',opacity:1,align:'rtl'},
                          accent:{scale:1,color:'#c1272d',opacity:1,align:'ltr'},
                          global:{scale:1}});
      set('table.table_zoom', 1); renderControls(); paint();
    }}, '↺ إعادة ضبط كل الأنماط')));
  const st = (get('table.style') || (set('table.style', {}), get('table.style')));
  LINE_DEFS.forEach(([key, label])=>{
    const cur = st[key] || (st[key] = {scale:1, color:'#12233f', opacity:1, align: key.startsWith('en')||key==='accent'?'ltr':'rtl'});
    const box = el('div',{style:'border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px;background:var(--soft)'});
    box.appendChild(el('div',{style:'font-size:12px;font-weight:700;margin-bottom:6px'}, label));

    /* الحجم */
    const sc = el('input',{type:'range', min:0.5, max:2.5, step:0.05, value: cur.scale ?? 1});
    const scOut = el('span',{style:'font-size:11px;color:var(--muted);min-width:44px;direction:ltr'}, (cur.scale ?? 1).toFixed(2)+'×');
    sc.addEventListener('input', ()=>{ cur.scale = parseFloat(sc.value); scOut.textContent = cur.scale.toFixed(2)+'×'; paint(); });
    box.appendChild(el('div',{class:'row', style:'margin-bottom:6px'},
      el('span',{style:'font-size:11px;color:var(--muted);min-width:34px'}, 'الحجم'), sc, scOut,
      el('button',{class:'mini', onclick:()=>{ cur.scale = Math.min(2.5,(cur.scale||1)+0.1); sc.value=cur.scale; scOut.textContent=cur.scale.toFixed(2)+'×'; paint(); }}, '＋'),
      el('button',{class:'mini', onclick:()=>{ cur.scale = Math.max(0.5,(cur.scale||1)-0.1); sc.value=cur.scale; scOut.textContent=cur.scale.toFixed(2)+'×'; paint(); }}, '－')
    ));

    /* اللون + الشفافية */
    const col = el('input',{type:'color', value: cur.color || '#12233f'});
    col.addEventListener('input', ()=>{ cur.color = col.value; paint(); });
    const op = el('input',{type:'range', min:0.2, max:1, step:0.05, value: cur.opacity ?? 1, style:'width:80px'});
    op.addEventListener('input', ()=>{ cur.opacity = parseFloat(op.value); paint(); });
    box.appendChild(el('div',{class:'row', style:'gap:8px'},
      el('span',{style:'font-size:11px;color:var(--muted)'}, 'اللون'), col,
      el('span',{style:'font-size:11px;color:var(--muted)'}, 'وضوح'), op
    ));

    /* المحاذاة */
    const dirSel = el('select',{style:'border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11.5px;margin-top:6px'});
    [['ltr','يسار (لاتيني)'],['rtl','يمين (عربي)']].forEach(([v,t])=>{ const o=el('option',{value:v},t); if((cur.align||'rtl')===v) o.selected=true; dirSel.appendChild(o); });
    dirSel.addEventListener('change', ()=>{ cur.align = dirSel.value; paint(); });
    box.appendChild(dirSel);
    s.appendChild(box);
  });
  return s;
}

/* ---------- محرر صفوف الجدول (يدعم الخلايا المتعددة) ---------- */
const KINDS = {
  std: 'إنجليزي: عنوان + قيمة',
  std_ar: 'إنجليزي + عنوان عربي على اليمين',
  ar_only: 'عنوان عربي فقط',
  ar_inline: 'قيمة عربية + عنوانها',
  ar_label_value: 'عنوان عربي فوق قيمة عربية',
  ar_pair: 'قيمة عربية + عنوان في سطر',
  value: 'قيمة فقط (ملوّنة)'
};

function rowsEditor(){
  const arr = get('table.rows') || [];
  const s = el('div');
  s.appendChild(el('p',{class:'hint', style:'margin:0 0 9px'},
    'كل صف يقسّم نفسه إلى خلايا بنِسب مئوية. اضبط المفتاح ليربط الخانة ببيانات الطالب.'));

  arr.forEach((r, i)=>{
    if (!r.cells) r.cells = [{label_en:r.label_en||'', label_ar:r.label_ar||'',
      value_en:r.value_en||'', value_ar:r.value_ar||'', key_en:r.key_en||'', key_ar:r.key_ar||'',
      w:50, kind:'std'}, {label_en:'', label_ar:r.label_ar_2||'', value_en:'', value_ar:r.value_ar_2||'',
      w:50, kind:'ar_inline'}];

    const box = el('div',{style:'border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--soft)'});

    head.appendChild(el('span',{style:'font-size:11px;font-weight:700;color:var(--muted)'}, 'صف ' + (i+1)));
    head.appendChild(el('div',{style:'flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},

    head.appendChild(el('button',{class:'mini', onclick:()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; renderControls(); paint(); } }}, '▼'));
    head.appendChild(el('button',{class:'mini danger', onclick:()=>{ arr.splice(i,1); renderControls(); paint(); }}, '×'));
    box.appendChild(head);

    r.cells.forEach((c, j)=>{
      const cb = el('div',{style:'border:1px dashed var(--line);border-radius:8px;padding:7px;margin-bottom:6px;background:#fff'});
      const ch = el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:5px'});
      ch.appendChild(el('span',{style:'font-size:10.5px;font-weight:700;color:var(--muted)'}, 'خلية ' + (j+1)));
      ch.appendChild(el('div',{style:'flex:1'}));
      const wIn = el('input',{type:'number', min:5, max:95, value: c.w ?? 25,

      ));

        miniField('مفتاح AR', c.key_ar||'', v=>{ c.key_ar=v; paint(); })
      ));
      const sel = el('select',{style:'border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;width:100%;margin-top:5px'});

    box.appendChild(el('div',{class:'row', style:'gap:6px'},

}

/* ---------- محرر الطلاب ---------- */
function studentsEditor(){
  const s = el('div');
  s.appendChild(el('p',{class:'hint', style:'margin:0 0 9px'},
    'اضغط «تعديل» على أي طالب ليظهر في المعاينة. عدد الطلاب: ' + STUDENTS.length));

  STUDENTS.forEach((st, i)=>{
    const active = i === CUR;
    const box = el('div',{style:
      'border:1px solid ' + (active?'var(--accent)':'var(--line)') + ';border-radius:10px;' +
      'padding:8px 9px;margin-bottom:8px;background:' + (active?'#fdf4f4':'var(--soft)')});

    /* سطر الرأس */
    const head = el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:6px'});
    head.appendChild(el('span',{style:'font-size:11px;font-weight:700;color:var(--muted);min-width:18px'}, String(i+1)));
    const nm = el('div',{style:'flex:1;font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},
      (st.name_ar||'بدون اسم') + ' ' + (st.family_ar||'') + (st.no? '  ·  '+st.no : ''));
    head.appendChild(nm);
    const file = el('input',{type:'file', accept:'image/*', hidden:''});
    file.addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{ st.photo = rd.result; CUR = i; syncStudentSelect(); renderControls(); paint(); toast('تم تحديث صورة الطالب'); };
      rd.readAsDataURL(f);
    });
    head.appendChild(el('button',{class:'mini', onclick:()=>file.click()}, st.photo ? '✓ صورة' : '📷 صورة'));
    head.appendChild(file);
    head.appendChild(el('button',{class:'mini'+ (active?'':' danger'), onclick:()=>{ CUR=i; syncStudentSelect(); renderControls(); paint(); }},
      active ? 'معروض' : 'تعديل'));
    head.appendChild(el('button',{class:'mini danger', onclick:()=>{
      STUDENTS.splice(i,1); if (CUR>=STUDENTS.length) CUR=Math.max(0,STUDENTS.length-1);
      renderControls(); syncStudentSelect(); paint();
    }}, '×'));
    box.appendChild(head);

    /* الحقول */
    const fields = [
      ['no','الرقم'], ['name_ar','الاسم'], ['family_ar','اللقب'],
      ['name_en','NAME (EN)'], ['family_en','SURNAME (EN)'], ['birth','تاريخ الميلاد'],
      ['place_ar','مكان الميلاد'], ['place_en','PLACE (EN)'],
      ['class_ar','الصف'], ['class_en','CLASS (EN)'],
      ['year_ar','العام الدراسي'], ['year_en','YEAR (EN)'], ['expiry','تاريخ الانتهاء'], ['issue','تاريخ الإصدار'], ['no2','جنس / ملاحظة']
    ];
    const grid = el('div',{class:'grid2'});
    fields.forEach(([k,lab])=>{
      const inp = el('input',{type:'text', value: st[k] ?? '',
        style:'border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px;width:100%'});
      inp.addEventListener('input', ()=>{
        st[k] = inp.value;
        if (k==='name_ar'||k==='no') { const t = head.children[1]; t.textContent = (st.name_ar||'بدون اسم')+' '+(st.family_ar||'')+(st.no?'  ·  '+st.no:''); syncStudentSelect(); }
        if (i===CUR) paint();
      });
      grid.appendChild(el('div',{class:'fld'}, el('label',{style:'font-size:10px'}, lab), inp));
    });
    if (active) box.appendChild(grid);
    s.appendChild(box);
  });
  return s;
}

function syncStudentSelect(){
  const sel = document.getElementById('studentSel');
  sel.innerHTML = '';
  STUDENTS.forEach((st,i)=>{
    const o = el('option',{value:i}, `${i+1}. ${st.name_ar||''} ${st.family_ar||''} ${st.no?('— '+st.no):''}`);
    if (i===CUR) o.selected = true;
    sel.appendChild(o);
  });
}

/* ==================================================================
   4) الطباعة والتصدير
   ================================================================== */
function doPrint(all){
  const area = document.getElementById('printArea');
  area.innerHTML = '';
  const mode = get('_print.mode') || 'card';
  const copies = Math.max(1, +get('_print.copies') || 1);
  const list = all ? STUDENTS : [currentStudent()];
  const Wmm = +CFG.card.w_mm, Hmm = +CFG.card.h_mm;

  const style = document.createElement('style');
  style.id = 'printStyle';
  document.getElementById('printStyle')?.remove();

  if (mode === 'card'){
    style.textContent = `@page{size:${Wmm}mm ${Hmm}mm;margin:0}`;
    document.head.appendChild(style);
    area.style.padding = '0';
    area.style.display = 'block';
    list.forEach(st=>{
      for (let k=0;k<copies;k++){
        const pc = el('div',{class:'pc', style:`width:${Wmm}mm;height:${Hmm}mm;overflow:hidden`}, 
          el('div',{style:`transform-origin:top left`}));
        pc.firstChild.innerHTML = cardHTML(CFG, st);
        area.appendChild(pc);
      }
    });
  } else {
    style.textContent = `@page{size:A4;margin:0}`;
    document.head.appendChild(style);
    const mg = +get('_print.margin') || 9, gp = +get('_print.gap') || 3.5;
    area.style.display = 'block';
    area.style.padding = mg + 'mm';
    const sheet = el('div',{class:'pc', style:`display:grid;grid-template-columns:repeat(auto-fill,${Wmm}mm);gap:${gp}mm;justify-content:center;padding:${mg}mm;box-sizing:border-box`});
    list.forEach(st=>{
      for (let k=0;k<copies;k++){
        const cell = el('div',{style:`width:${Wmm}mm;height:${Hmm}mm;overflow:hidden;outline:0.2mm dashed #bbb`});
        cell.innerHTML = cardHTML(CFG, st);
        sheet.appendChild(cell);
      }
    });
    area.appendChild(sheet);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>setTimeout(()=>window.print(), 120));
  else setTimeout(()=>window.print(), 120);
}

function downloadPNG(){
  const Wmm = +CFG.card.w_mm, Hmm = +CFG.card.h_mm;
  const scale = 300/96;
  const pxW = Math.round(Wmm*96/25.4*scale), pxH = Math.round(Hmm*96/25.4*scale);
  const html = cardHTML(CFG, currentStudent());
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${pxW}" height="${pxH}">`
    + `<foreignObject width="100%" height="100%" x="0" y="0">`
    + `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${Wmm*96/25.4}px;height:${Hmm*96/25.4}px;transform:scale(${scale});transform-origin:top left">${html}</div>`
    + `</foreignObject></svg>`;
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement('canvas'); cv.width = pxW; cv.height = pxH;
    const ctx = cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,pxW,pxH);
    ctx.drawImage(img,0,0);
    cv.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `card_${currentStudent().no||'student'}.png`;
      a.click();
      toast('تم تنزيل الصورة');
    }, 'image/png');
  };
  img.onerror = ()=> toast('تعذّر التصدير من المتصفح — استخدم build_print.py لدقة 300dpi');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============ نظام القالب (تصميم + شعار + خلفية + ألوان + طلاب) ============ */
const TEMPLATE_APP = 'card-designer';
const TEMPLATE_VER = 2;

function buildTemplate(){
  return {
    app: TEMPLATE_APP,
    version: TEMPLATE_VER,
    saved_at: new Date().toISOString(),
    name: (CFG.meta && CFG.meta.name) || 'قالب بطاقة',
    config: clone(CFG),
    students: clone(STUDENTS)
  };
}

function saveCfg(){
  const tpl = buildTemplate();
  const blob = new Blob([JSON.stringify(tpl, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const nm = (tpl.name || 'قالب_البطاقة').replace(/[\\/:*?"<>|]+/g,'_');
  a.download = nm + '.cardtemplate.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('تم حفظ القالب مع الصور والألوان ✔');
}

function deepMerge(base, upd){
  const out = clone(base);
  Object.entries(upd || {}).forEach(([k,v])=>{
    if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]))
      out[k] = deepMerge(out[k], v);
    else out[k] = v;
  });
  return out;
}

function applyTemplate(obj){
  try{
    const cfgIn = obj.config || obj;                 // يدعم القوالب القديمة أيضًا
    CFG = deepMerge(DEFAULT_CFG, cfgIn);
    if (Array.isArray(obj.students) && obj.students.length) STUDENTS = obj.students;
    CUR = 0;
    // إعادة بناء كل شيء
    document.getElementById('controls').innerHTML = '';
    CURRENT_ACC = null;
    renderControls();
    syncStudentSelect();
    paint();
    autoFit();
    toast('تم تحميل القالب: ' + (obj.name || 'بدون اسم'));
    return true;
  }catch(e){
    console.error(e);
    toast('ملف القالب غير صالح');
    return false;
  }
}

function loadCfg(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let obj;
    try { obj = JSON.parse(rd.result); } catch(e){ toast('ملف JSON غير صالح'); return; }
    applyTemplate(obj);
  };
  rd.readAsText(file, 'utf-8');
}

/* سحب وإفلات ملف القالب على الصفحة */
document.addEventListener('dragover', e=>{ e.preventDefault(); document.body.style.outline='3px dashed var(--accent)'; });
document.addEventListener('dragleave', ()=>{ document.body.style.outline=''; });
document.addEventListener('drop', e=>{
  e.preventDefault(); document.body.style.outline='';
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (/\.json$/i.test(f.name)) loadCfg(f);
  else toast('اسحب ملف قالب بصيغة JSON');
});

function importCSV(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const rows = parseCSV(rd.result);
      if (rows.length) { STUDENTS = rows; CUR = 0; renderControls(); syncStudentSelect(); paint(); toast('تم استيراد ' + rows.length + ' طالبًا'); }
    };
    rd.readAsText(f, 'utf-8');
  };
  inp.click();
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if (!lines.length) return [];
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';
  const split = line => {
    const out=[]; let cur='', q=false;
    for (let i=0;i<line.length;i++){
      const ch = line[i];
      if (q){ if (ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if (ch==='"') q=true; else if (ch===sep){ out.push(cur); cur=''; } else cur+=ch; }
    }
    out.push(cur); return out.map(s=>s.trim());
  };
  const head = split(lines[0]);
  return lines.slice(1).map(l=>{
    const cells = split(l); const o = {};
    head.forEach((h,i)=> o[h] = cells[i] ?? '');
    return o;
  });
}
function exportCSV(){
  const keys = ['no','name_ar','family_ar','name_en','family_en','birth','place_ar','place_en','class_ar','class_en','year_ar','year_en','expiry','issue'];
  const esc2 = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = '\uFEFF' + keys.join(',') + '\n' + STUDENTS.map(st=>keys.map(k=>esc2(st[k])).join(',')).join('\n');
  const b = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'students.csv'; a.click();
  toast('تم تصدير بيانات الطلاب');
}

/* ==================================================================
   5) ربط الأحداث والتشغيل
   ================================================================== */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on');
  ACTIVE_TAB = b.dataset.tab;
  renderControls();
});
document.getElementById('studentSel').addEventListener('change', e=>{ CUR = +e.target.value; renderControls(); paint(); });
document.getElementById('zoom').addEventListener('input', e=>{ ZOOM = +e.target.value; applyZoom(); });
document.getElementById('showGuides').addEventListener('change', paint);
document.getElementById('btnPrint').addEventListener('click', ()=>{
  ACTIVE_TAB='export'; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab==='export'));
  renderControls(); doPrint(true);
});
document.getElementById('btnPng').addEventListener('click', downloadPNG);
document.getElementById('btnSave').addEventListener('click', saveCfg);
document.getElementById('btnLoad').addEventListener('click', ()=>document.getElementById('fileLoad').click());
document.getElementById('fileLoad').addEventListener('change', e=>{ if(e.target.files[0]) loadCfg(e.target.files[0]); });

function autoFit(){
  const wrap = document.querySelector('.cardwrap');
  if (!wrap) return;
  const availW = wrap.clientWidth - 56;
  const availH = Math.max(240, window.innerHeight - 300);
  const cardW = MM(+CFG.card.w_mm), cardH = MM(+CFG.card.h_mm);
  const z = Math.min(availW/cardW, availH/cardH) * 100;
  ZOOM = Math.max(40, Math.min(420, Math.round(z)));
  document.getElementById('zoom').value = ZOOM;
  applyZoom();
}
renderControls();
syncStudentSelect();
paint();
autoFit();
window.addEventListener('resize', autoFit);
if (document.fonts) document.fonts.ready.then(()=>{ paint(); autoFit(); });
</script>
